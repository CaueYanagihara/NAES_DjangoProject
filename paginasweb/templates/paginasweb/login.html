{% extends "paginasweb/modelos/index.html" %}
{% load static %}

{% block header %}
<div class="text-center mt-5">
    <h1 class="display-6 fw-bolder mb-4">
        <span class="text-gradient d-inline">Entrar</span>
    </h1>
</div>
{% endblock header %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <form method="post" action="">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger">Usuário ou senha inválidos.</div>
            {% endif %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Usuário</label>
                <input type="text" name="username" autofocus required maxlength="150" class="form-control" id="id_username">
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">Senha</label>
                <input type="password" name="password" required class="form-control" id="id_password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <div class="text-center mt-3">
            <span class="text-muted">Não tem uma conta?</span>
            <a href="{% url 'cadastrar-usuario' %}" class="btn btn-outline-primary ms-2">Cadastrar-se</a>
        </div>
    </div>
</div>
{% endblock conteudo %}
