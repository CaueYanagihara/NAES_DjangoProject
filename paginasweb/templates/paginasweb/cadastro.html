{% extends "paginasweb/modelos/index.html" %}

{% load crispy_forms_tags %}
{% load static %}

{% block header %}
<div class="text-center">
    <h1 class="display-6 fw-bolder mb-4">
        <span class="text-gradient d-inline">Cadastro de Usuário</span>
    </h1>
</div>
{% endblock header %}

{% block conteudo %}
<style>
    form {
        font-size: 120%;
    }
</style>
<div class="row justify-content-center">
    <div class="col-lg-6">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <p class="text-center">
                <button type="submit" class="btn btn-success m-2">Cadastrar</button>
                <a href="{% url 'login' %}" class="btn btn-outline-dark m-2">Voltar</a>
            </p>
        </form>
    </div>
</div>
{% endblock conteudo %}
