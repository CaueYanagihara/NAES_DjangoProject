{% extends "paginasweb/modelos/index.html" %}

{% load static %}

{% block conteudo %}
<div class="row">
    <div class="col-lg-6">
        <div class="text-center my-3">
            <h2 class="display-5 fw-bolder"><span class="text-gradient d-inline">Sistema NAES 2025</span></h2>
            <p class="lead fw-light mb-4">Plataforma completa para gestão de agendamentos e serviços.</p>
            <p class="text-muted">Gerencie empresas, clientes, atendentes e agendamentos em um só lugar!</p>
            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                    <i class="fas fa-sign-in-alt me-2"></i>Fazer Login
                </a>
                <a href="{% url 'cadastrar-usuario' %}" class="btn btn-outline-primary btn-lg">
                    <i class="fas fa-user-plus me-2"></i>Criar Conta
                </a>
            </div>
        </div>
    </div>
    <div class="col-lg-6 text-center">
        <img src="{% static 'img/servicos.png' %}" class="img-fluid w-100" alt="Sistema de Agendamentos">
    </div>
</div>
{% endblock conteudo %}
